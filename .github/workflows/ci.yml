
name: CI

permissions:
  id-token: write  # Required for OIDC
  contents: write
  pages: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual triggers

jobs:
  check-and-tag:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check-update.outputs.should-build }}
      new-version: ${{ steps.check-update.outputs.new-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Clojure and Babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - name: Check for scittle updates and create tag
        id: check-update
        run: |
          # Skip check if this was triggered by a tag push
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "new-version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if there's a new version to release
          if bb check-newer; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            bb tag
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Clojure and Babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build plugins
        run: bb release

      - name: NPM Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --tag latest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/all/resources/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
